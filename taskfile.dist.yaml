version: '3'
tasks:
  nixos:
    vars:
      TYPE: '{{.TYPE | default (.CLI_ARGS | splitList " " | first) }}'
    requires:
      vars:
      - name: TYPE
        enum:
        - switch
        - boot
        - test
    cmds:
    - sudo nixos-rebuild {{.TYPE}} --flake .#
