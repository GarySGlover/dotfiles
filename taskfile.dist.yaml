# [[file:modules.org::*Taskfile][Taskfile:1]]
version: '3'
tasks:
  check:
    desc: Check nix flake for all systems
    cmds:
    - nix flake check ./ --show-trace --all-systems
  update:
    desc: Ensure all repository components are up-to-date
    cmds:
    - task: update-precommit
    - task: update-nix
    - task: check
    - nix develop --build
    - pre-commit run --all-files
  update-precommit:
    desc: Update pre-commit hooks to their latest versions
    cmds:
    - pre-commit autoupdate
  update-nix:
    desc: Refresh Nix flake inputs to the latest available versions
    cmds:
    - nix flake update
  nixos:*:
    internal: true
    desc: Build nixos
    aliases:
    - nixos
    vars:
      TYPE: '{{if (gt (len .MATCH) 0)}}{{(index .MATCH 0)}}{{else}}{{.TYPE}}{{end}}'
    requires:
      vars:
      - name: TYPE
        enum:
        - switch
        - boot
        - test
    cmds:
    - sudo nixos-rebuild {{.TYPE}} --flake .#
  nixos-test:
    desc: Build and test nixos
    cmds:
    - task: nixos:test
  nixos-switch:
    desc: Build and switch nixos
    cmds:
    - task: nixos:switch
  nixos-boot:
    desc: Build and boot nixos
    cmds:
    - task: nixos:boot
# Taskfile:1 ends here
