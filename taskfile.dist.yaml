# [[file:modules.org::*Taskfile][Taskfile:1]]
version: '3'
tasks:
  check:
    desc: Check nix flake for all systems
    cmds:
    - nix flake check ./ --show-trace --all-systems
  update:
    desc: Ensure all repository components are up-to-date
    cmds:
    - task: update-precommit
    - task: update-nix
    - task: check
    - nix develop --build
    - pre-commit run --all-files
  update-precommit:
    desc: Update pre-commit hooks to their latest versions
    cmds:
    - pre-commit autoupdate
  update-nix:
    desc: Refresh Nix flake inputs to the latest available versions
    cmds:
    - nix flake update
  nixos:*:
    desc: Build nixos
    aliases:
    - nixos
    vars:
      TYPE: '{{if (gt (len .MATCH) 0)}}{{(index .MATCH 0)}}{{else}}{{.TYPE}}{{end}}'
      # TYPE: '{{coalesce (index .MATCH 0) .TYPE}}'
    requires:
      vars:
      - name: TYPE
        enum:
        - switch
        - boot
        - test
    cmds:
    - sudo nixos-rebuild {{.TYPE}} --flake .#
  home:
    cmds:
    - nix build .#homeConfigurations."gary_glover".activationPackage --extra-experimental-features nix-command --extra-experimental-features flakes --show-trace
    - ./result/activate
# Taskfile:1 ends here
